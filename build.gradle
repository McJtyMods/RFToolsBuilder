buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = [rootProject.file('gradletools.gradle'),
                   file('../Multi_fabric/gradletools.gradle'),
                   file('../gradletools.gradle')].find { it.isFile() }
if (sharedTools != null) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.1.2_fabric/gradletools.gradle'
}

group = "com.github.mcjty"
base.archivesName = "rftoolsbuilder-fabric"
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// CI revisions identify the artifact; the runtime version stays stable.
def modVersion = project.version.toString()
if (System.getenv('BUILD_NUMBER') != null) {
    version += "-${System.getenv('BUILD_NUMBER')}"
}

repos()
access()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    mc()
    config()
    energy()
    top()
    jei()
    mcjtylib()
    rftoolsbase()
}

modpublisher(['the-one-probe'], ['mcjtylib', 'rftools-base', 'fabric-api', 'forge-config-api-port'], ['the-one-probe'], ['mcjtylib', 'rftools-base', 'fabric-api', 'forge-config-api-port'], [])

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '1G'
}

if (providers.gradleProperty('builderPortTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'rftoolsbuilder_fabric_test'
        enableGameTests = false
    }
    dependencies {
        gametestImplementation project(':ModXNet')
    }
}
