pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.firstdark.dev/releases' }
        maven { url = 'https://maven.fabricmc.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Until RFToolsBase Fabric is published, use its sibling source checkout standalone.
if (file('../RFToolsBase_fabric/build.gradle').isFile()) {
    include 'RFToolsBase'
    project(':RFToolsBase').projectDir = file('../RFToolsBase_fabric')
}

// Use matching local library sources when developing this port standalone.
['McJtyLib', 'TheOneProbe'].each { mod ->
    if (file("../${mod}_fabric/build.gradle").isFile()) {
        include mod
        project(":${mod}").projectDir = file("../${mod}_fabric")
    }
}

if (providers.gradleProperty('builderPortTests').isPresent() && file('../ModXNet_fabric/build.gradle').isFile()) {
    include 'ModXNet'
    project(':ModXNet').projectDir = file('../ModXNet_fabric')
}
